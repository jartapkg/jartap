
<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЖарТап — Ак нике</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      color: #24352a;
    }
    header {
      background: #174d32;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 480px;
      margin: 35px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0001;
    }
    h2 { text-align: center; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #17633c;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #10472b; }
    #message {
      margin-top: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .note {
      font-size: 13px;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<header>
  <h1>ЖарТап</h1>
  <p>Ак никеге өмүрлүк жар табуу</p>
  <b>18 жаштан жогоркулар үчүн</b>
</header>

<main>
  <h2>Катталуу</h2>

  <form id="signupForm">
    <input id="age" type="number" min="18" max="120"
      placeholder="Жашыңыз" required>

    <input id="email" type="email"
      placeholder="Электрондук почта" required>

    <input id="password" type="password"
      placeholder="Сырсөз (кеминде 8 белги)" minlength="8" required>

    <button type="submit">Катталуу</button>
  </form>

  <hr>

  <h2>Аккаунтка кирүү</h2>

  <form id="loginForm">
    <input id="loginEmail" type="email"
      placeholder="Электрондук почта" required>

    <input id="loginPassword" type="password"
      placeholder="Сырсөз" required>

    <button type="submit">Кирүү</button>
  </form>

  <p id="message"></p>

  <p class="note">
    Бул платформа 18 жаштан жогоркуларга арналган.
    Жаш куракты текшерүү катталуу формасы менен гана чектелбеши керек.
  </p>
</main>

<script>
const SUPABASE_URL = "https://zowpiukktltjnnnitqyc.supabase.co";
const SUPABASE_KEY = "sb_publishable_SSuzDR4jpJpo2sOsGv1tsg_lDgVgTvR";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");

document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const age = Number(document.getElementById("age").value);
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (age < 18) {
    message.textContent = "Катталуу үчүн 18 жаштан жогору болуу керек.";
    return;
  }

  message.textContent = "Катталуу жүрүп жатат...";

  const { data, error } = await client.auth.signUp({
    email,
    password,
    options: {
      data: { age }
    }
  });

  if (error) {
    message.textContent = "Ката: " + error.message;
  } else {
    message.textContent =
      "Катталуу сурамы кабыл алынды. Электрондук почтаңызды текшериңиз.";
  }
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  message.textContent = "Кирүү текшерилип жатат...";

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = "Ката: " + error.message;
  } else {
    message.textContent = "Аккаунтка ийгиликтүү кирдиңиз!";
  }
});
</script>

</body>
</html>
